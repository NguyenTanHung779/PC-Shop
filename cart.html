<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Your Cart | FirePCGaming</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </head>
<body>
    <!-- Header -->
    <header class="text-white">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand" href="index.html">
                    <img src="images/FIREPCmini.png" alt="Logo" class="img-fluid" style="height: 50px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
                        <li class="nav-item" id="login-register">
                            <a class="nav-link login-btn d-flex align-items-center gap-2" href="login.html">
                                <span class="login-icon rounded-circle d-flex align-items-center justify-content-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white" class="bi bi-person" viewBox="0 0 16 16">
                                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                                    </svg>
                                </span>
                                Log In 
                            </a>
                        </li>
                        <li class="nav-item" id="register-link">
                            <a class="nav-link login-btn d-flex align-items-center gap-2" href="register.html">
                                <span class="login-icon rounded-circle d-flex align-items-center justify-content-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="white" class="bi bi-person-plus" viewBox="0 0 16 16">
                                        <path d="M6 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H1s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C9.516 10.68 8.289 10 6 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                                        <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5z"/>
                                    </svg>
                                </span>
                                Register
                            </a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="profile.html" style="display: none;" id="profile">Profile</a></li>
                        <li class="nav-item">
                            <a class="nav-link" href="cart.html">
                                <img src="images/Crate icon.png" alt="Cart Icon" class="cart-icon">
                                <span id="cart-count" class="badge bg-primary">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- Cart Section -->
    <section class="cart py-5">
        <div class="container">
            <h2 class="text-center mb-4">Your Cart</h2>
            <div id="empty-cart" class="alert alert-warning text-center" role="alert" style="display: none;">
                Your cart is empty. <a href="index.html" class="alert-link">Continue shopping</a>.
            </div>
            <div id="cart-content" style="display: none;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Product</th>
                                <th scope="col">Name</th>
                                <th scope="col">Price</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items">
                            <!-- Cart items will be dynamically added here -->
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="2" class="text-end fw-bold">Total:</td>
                                <td id="cart-total" class="fw-bold">$0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="index.html" class="btn btn-primary">Continue Shopping</a>
                    <div>
                        <button id="clear-cart" class="btn btn-danger me-2">Clear Cart</button>
                        <button id="checkout" class="btn btn-success">Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-white py-4">
        <div class="container text-center">
            <div class="mb-3">
                <img src="images/FIREPCmini.png" alt="FirePCGaming Logo" style="height: 50px;">
            </div>
            <div class="d-flex justify-content-center mb-3">
                <a href="https://youtu.be/dQw4w9WgXcQ?si=8-KmiNCbu7ubt8Oy" target="_blank" class="me-3">
                    <img src="images/youtube.png" alt="YouTube" style="height: 30px;">
                </a>
                <a href="https://youtu.be/dQw4w9WgXcQ?si=8-KmiNCbu7ubt8Oy" target="_blank">
                    <img src="images/discord.png" alt="Discord" style="height: 30px;">
                </a>
            </div>
            <p>© 2025 by FirePCGaming LLC / Privacy Policy / Terms of Service / Warranty & Return Policy</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        $(document).ready(function () {
            // Login status
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const loginRegister = document.getElementById('login-register');
            const profile = document.getElementById('profile');
        
            if (isLoggedIn) {
                loginRegister.style.display = 'none';
                profile.style.display = 'block';
            } else {
                loginRegister.style.display = 'block';
                profile.style.display = 'none';
            }
        
            // Display cart count
            let cartCount = parseInt(localStorage.getItem('cartCount')) || 0;
            let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
            const cartCountElement = document.getElementById('cart-count');
            cartCountElement.textContent = cartCount;
        
            // Display cart items
            const cartItemsContainer = document.getElementById('cart-items');
            const emptyCartMessage = document.getElementById('empty-cart');
            const cartContent = document.getElementById('cart-content');
            const cartTotalElement = document.getElementById('cart-total');
            const clearCartButton = document.getElementById('clear-cart');
            const checkoutButton = document.getElementById('checkout');
        
            function updateCartDisplay() {
                cartItemsContainer.innerHTML = ''; 
                let total = 0;
        
                // Sync cart count with the number of items
                cartCount = cartItems.length;
                localStorage.setItem('cartCount', cartCount);
                cartCountElement.textContent = cartCount;
        
                if (cartItems.length === 0) {
                    emptyCartMessage.style.display = 'block';
                    cartContent.style.display = 'none';
                } else {
                    emptyCartMessage.style.display = 'none';
                    cartContent.style.display = 'block';
        
                    cartItems.forEach((item, index) => {
                        const price = parseFloat(item.price.replace('$', '').replace(',', ''));
                        total += price;
        
                        const cartItem = document.createElement('tr');
                        cartItem.innerHTML = `
                            <td>
                                <img src="${item.image}" alt="${item.name}" style="width: 100px; height: auto;">
                            </td>
                            <td>${item.name}</td>
                            <td>${item.price}</td>
                            <td>
                                <button class="btn btn-sm btn-danger remove-item" data-index="${index}">Remove</button>
                            </td>
                        `;
                        cartItemsContainer.appendChild(cartItem);
                    });
        
                    // Update total
                    cartTotalElement.textContent = `$${total.toFixed(2)}`;
                }
            }
        
            // Initial display
            updateCartDisplay();
        
            // Remove item functionality
            $(document).on('click', '.remove-item', function () {
                const index = $(this).data('index');
                cartItems.splice(index, 1);
        
                // Update localStorage
                localStorage.setItem('cartItems', JSON.stringify(cartItems));
        
                // Update display
                updateCartDisplay();
            });
        
            // Clear cart functionality
            clearCartButton.addEventListener('click', () => {
                cartItems = [];
                cartCount = 0;
        
                localStorage.setItem('cartCount', '0');
                localStorage.setItem('cartItems', JSON.stringify([]));
        
                cartCountElement.textContent = '0';
                updateCartDisplay();
            });
        
            // Checkout functionality (placeholder)
            checkoutButton.addEventListener('click', () => {
                alert('Proceeding to checkout... (This is a placeholder)');
                // Add actual checkout logic here
            });
        
            // Navbar scroll behavior
            let lastScrollTop = 0;
            const navbar = document.querySelector('header');
        
            window.addEventListener('scroll', () => {
                const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
        
                if (currentScroll > lastScrollTop) {
                    navbar.style.top = '-100px';
                } else {
                    navbar.style.top = '0';
                }
        
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            });
        });
        </script>
</body>
</html>
